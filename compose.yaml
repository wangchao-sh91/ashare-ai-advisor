name: ashare-ai-advisor

services:
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    env_file:
      - path: ${API_ENV_FILE:-./apps/api/.env}
        required: false
    environment:
      APP_ENV: production
      BIND_MODE: container
      API_HOST: 0.0.0.0
      API_PORT: 8000
    expose:
      - "8000"
    init: true
    restart: unless-stopped
    stop_grace_period: 30s
    networks:
      - internal
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()",
        ]
      interval: 10s
      timeout: 3s
      start_period: 20s
      retries: 6

  web:
    build:
      context: ./apps/web
      dockerfile: Dockerfile
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:8080"
    restart: unless-stopped
    networks:
      - internal
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      start_period: 5s
      retries: 6

networks:
  internal:
    driver: bridge
