[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ashare-ai-advisor-api"
version = "0.1.0"
description = "FastAPI backend for the A-share AI research advisor."
requires-python = ">=3.12,<3.13"
dependencies = [
  "fastapi>=0.116,<1",
  "httpx>=0.28,<1",
  "langchain>=0.3,<1",
  "langchain-openai>=0.3,<1",
  "openai>=1.109,<3",
  "pydantic-settings>=2.10,<3",
  "tushare==1.4.29",
  "uvicorn[standard]>=0.35,<1",
]

[project.optional-dependencies]
dev = [
  "detect-secrets>=1.5,<2",
  "mypy>=1.17,<2",
  "pandas-stubs>=2.2,<4",
  "pre-commit>=4.3,<5",
  "pytest>=8.4,<9",
  "pytest-asyncio>=1.1,<2",
  "pytest-cov>=6.2,<7",
  "ruff>=0.12,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --cov=app --cov-report=term-missing"
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.coverage.run]
branch = true

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["app"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["tushare", "tushare.*"]
ignore_missing_imports = true

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "ASYNC"]

[tool.ruff.format]
quote-style = "double"
